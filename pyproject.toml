[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datacenter-land"
version = "0.1.0"
description = "What land did the data center boom take, and who lives next to it? A global open-data analysis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yanice Zeng" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "requests>=2.31",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "folium>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
dcland = "dcland.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 145
target-version = "py310"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
